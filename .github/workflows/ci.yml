name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentfleet
          POSTGRES_PASSWORD: agentfleet
          POSTGRES_DB: agentfleet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentfleet"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      # CI-only throwaway credentials for the service container above.
      DATABASE_URL: postgresql+asyncpg://agentfleet:agentfleet@localhost:5432/agentfleet_test
      TEST_DATABASE_URL: postgresql+asyncpg://agentfleet:agentfleet@localhost:5432/agentfleet_test

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes exact version tags only (no floating major tag).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check models match migrations
        run: uv run alembic check

      - name: Tests
        run: uv run pytest -v
