[project]
name = "agentfleet-backend"
description = "AgentFleet API, orchestration engine and workers"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "migrations", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async layer runs driver calls inside greenlets; without this, lines that
# execute after an awaited database call can be reported as missed.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# The gate fails CI on a meaningful drop. It is below the current figure on purpose:
# some later code (signal handling, process entry points) is not worth contorting to cover.
fail_under = 90
